<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TEBIKI QR">
  <title>TEBIKI QR読取</title>
  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    .wrap {
      max-width: 780px;
      margin: 0 auto;
      padding: 36px 18px;
    }
    .card {
      background: #fff;
      border-radius: 22px;
      padding: 34px 24px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.16);
    }
    h1 {
      margin: 8px 0 18px;
      font-size: 36px;
    }
    .message {
      font-size: 26px;
      line-height: 1.6;
      margin: 16px 0 26px;
    }
    #qrInput {
      width: 92%;
      font-size: 26px;
      padding: 20px 16px;
      border: 4px solid #333;
      border-radius: 16px;
      text-align: center;
      box-sizing: border-box;
      background: #fff;
    }
    #qrInput:focus {
      background: #fffde8;
      outline: none;
      border: 5px solid #111;
    }
    .btn {
      display: inline-block;
      margin-top: 22px;
      padding: 18px 28px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: #fff;
      font-size: 22px;
      cursor: pointer;
      text-decoration: none;
    }
    .btn-blue {
      background: #0b5cad;
    }
    .status {
      margin-top: 24px;
      padding: 16px;
      background: #eef3f8;
      border-radius: 14px;
      color: #333;
      font-size: 18px;
      line-height: 1.5;
      word-break: break-all;
      text-align: left;
    }
    .small {
      margin-top: 18px;
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      text-align: left;
    }
    #openLink {
      display: none;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>TEBIKI動画 QR読取</h1>

      <div class="message">
        QRコードをスキャンしてください<br>
        読み取った動画リンクを開きます
      </div>

      <input
        id="qrInput"
        type="text"
        placeholder="ここをタップしてQRを読む"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="none"
      >

      <br>
      <button class="btn" onclick="ready()">読み取り待機にする</button>
      <a id="openLink" class="btn btn-blue" href="#" rel="noreferrer noopener">TEBIKI動画を開く</a>

      <div class="status" id="status">
        状態：読み取り待機中
      </div>

      <div class="small">
        ※この版は、TEBIKIへ移動する時に参照元情報を渡さない設定です。<br>
        ※QRを読むと「TEBIKI動画を開く」ボタンが表示されます。まずはそのボタンで開けるか確認してください。<br>
        ※開けた場合、自動起動版へ再調整できます。
      </div>
    </div>
  </div>

  <script>
    const input = document.getElementById("qrInput");
    const status = document.getElementById("status");
    const openLink = document.getElementById("openLink");
    let timer = null;

    function ready() {
      input.value = "";
      openLink.style.display = "none";
      openLink.href = "#";
      input.focus();
      status.textContent = "状態：読み取り待機中";
    }

    function cleanText(value) {
      return (value || "").trim().replace(/[\r\n\t ]+/g, "");
    }

    function setUrl() {
      const url = cleanText(input.value);

      if (!url) {
        status.textContent = "URLが入力されていません。QRコードを読み取ってください。";
        input.focus();
        return;
      }

      if (!(url.startsWith("http://") || url.startsWith("https://"))) {
        status.textContent = "URLではない内容を読み取りました：" + url;
        input.value = "";
        input.focus();
        return;
      }

      openLink.href = url;
      openLink.style.display = "inline-block";
      status.textContent = "読み取りURL：" + url + "\n表示された「TEBIKI動画を開く」を押してください。";
    }

    input.addEventListener("input", function() {
      clearTimeout(timer);
      timer = setTimeout(setUrl, 500);
    });

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(timer);
        setUrl();
      }
    });

    window.addEventListener("load", function() {
      setTimeout(ready, 600);
    });

    document.body.addEventListener("click", function(event) {
      if (event.target.tagName !== "BUTTON" && event.target.tagName !== "A") {
        input.focus();
      }
    });
  </script>
</body>
</html>
