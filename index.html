<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="referrer" content="no-referrer">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="TEBIKI QR">
  <title>TEBIKI QR読取 v5</title>
  <style>
    body {
      margin: 0;
      background: #f4f6f8;
      color: #222;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
      text-align: center;
    }
    .version {
      position: fixed;
      top: 12px;
      right: 14px;
      background: #222;
      color: #fff;
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      z-index: 999;
    }
    .wrap {
      max-width: 820px;
      margin: 0 auto;
      padding: 38px 18px;
    }
    .card {
      background: #fff;
      border-radius: 22px;
      padding: 34px 24px;
      box-shadow: 0 3px 16px rgba(0,0,0,0.16);
    }
    h1 {
      margin: 8px 0 10px;
      font-size: 36px;
    }
    .subtitle {
      color: #555;
      font-size: 18px;
      margin-bottom: 18px;
    }
    .message {
      font-size: 25px;
      line-height: 1.6;
      margin: 16px 0 24px;
    }
    #qrInput {
      width: 92%;
      font-size: 25px;
      padding: 20px 16px;
      border: 4px solid #333;
      border-radius: 16px;
      text-align: center;
      box-sizing: border-box;
      background: #fff;
    }
    #qrInput:focus {
      background: #fffde8;
      outline: none;
      border: 5px solid #111;
    }
    .btn {
      display: inline-block;
      margin-top: 18px;
      margin-left: 4px;
      margin-right: 4px;
      padding: 17px 22px;
      border: none;
      border-radius: 14px;
      background: #222;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
      text-decoration: none;
    }
    .blue { background: #0b5cad; }
    .green { background: #0b6b2a; }
    .red { background: #b42318; }
    .status {
      margin-top: 24px;
      padding: 16px;
      background: #eef3f8;
      border-radius: 14px;
      color: #333;
      font-size: 18px;
      line-height: 1.5;
      word-break: break-all;
      text-align: left;
      white-space: pre-wrap;
    }
    .small {
      margin-top: 18px;
      color: #666;
      font-size: 16px;
      line-height: 1.6;
      text-align: left;
    }
    #openLink, #openBlankLink {
      display: none;
    }
  </style>
</head>
<body>
  <div class="version">v5</div>

  <div class="wrap">
    <div class="card">
      <h1>TEBIKI動画 QR読取</h1>
      <div class="subtitle">GitHub Pages版 v5 / リダイレクト確認用</div>

      <div class="message">
        QRコードをスキャンしてください<br>
        読み取ったURLを下に表示します
      </div>

      <input
        id="qrInput"
        type="text"
        placeholder="ここをタップしてQRを読む"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
        inputmode="none"
      >

      <br>
      <button class="btn" onclick="ready()">読み取り待機</button>
      <button class="btn blue" onclick="openSameTab()">同じ画面で開く</button>
      <button class="btn green" onclick="openNewTab()">新しいタブで開く</button>
      <button class="btn red" onclick="copyUrl()">URLをコピー</button>

      <br>
      <a id="openLink" class="btn blue" href="#" target="_self" rel="noreferrer">リンク：同じ画面</a>
      <a id="openBlankLink" class="btn green" href="#" target="_blank" rel="noreferrer noopener">リンク：新しいタブ</a>

      <div class="status" id="status">
状態：読み取り待機中
バージョン：v5
      </div>

      <div class="small">
        ※Too many redirections が出る場合、TEBIKI側が外部ページからの遷移をリダイレクト処理している可能性があります。<br>
        ※「URLをコピー」後、Safariのアドレスバーへ貼り付けて開ける場合は、URL自体は正しく、外部ページからの遷移だけが問題です。<br>
        ※今後の版では、右上に必ずバージョン番号を表示します。
      </div>
    </div>
  </div>

  <script>
    const VERSION = "v5";
    const input = document.getElementById("qrInput");
    const status = document.getElementById("status");
    const openLink = document.getElementById("openLink");
    const openBlankLink = document.getElementById("openBlankLink");
    let timer = null;
    let currentUrl = "";

    function ready() {
      input.value = "";
      currentUrl = "";
      openLink.style.display = "none";
      openBlankLink.style.display = "none";
      openLink.href = "#";
      openBlankLink.href = "#";
      input.focus();
      status.textContent = "状態：読み取り待機中\nバージョン：" + VERSION;
    }

    function cleanText(value) {
      return (value || "").trim().replace(/[\r\n\t ]+/g, "");
    }

    function setUrl() {
      const url = cleanText(input.value);

      if (!url) {
        status.textContent = "状態：URL未入力\nバージョン：" + VERSION;
        input.focus();
        return "";
      }

      if (!(url.startsWith("http://") || url.startsWith("https://"))) {
        status.textContent = "状態：URLではない内容です\n内容：" + url + "\nバージョン：" + VERSION;
        input.value = "";
        input.focus();
        return "";
      }

      currentUrl = url;
      openLink.href = url;
      openBlankLink.href = url;
      openLink.style.display = "inline-block";
      openBlankLink.style.display = "inline-block";
      status.textContent = "状態：URL読取完了\nURL：" + url + "\nバージョン：" + VERSION;
      return url;
    }

    function openSameTab() {
      const url = setUrl();
      if (!url) return;
      status.textContent = "状態：同じ画面で開いています\nURL：" + url + "\nバージョン：" + VERSION;
      window.location.assign(url);
    }

    function openNewTab() {
      const url = setUrl();
      if (!url) return;
      status.textContent = "状態：新しいタブで開いています\nURL：" + url + "\nバージョン：" + VERSION;
      window.open(url, "_blank", "noopener,noreferrer");
    }

    async function copyUrl() {
      const url = setUrl();
      if (!url) return;
      try {
        await navigator.clipboard.writeText(url);
        status.textContent = "状態：URLをコピーしました\nSafariのアドレスバーに貼り付けて確認してください\nURL：" + url + "\nバージョン：" + VERSION;
      } catch (e) {
        status.textContent = "状態：コピーできませんでした。URLを長押ししてコピーしてください\nURL：" + url + "\nバージョン：" + VERSION;
      }
    }

    input.addEventListener("input", function() {
      clearTimeout(timer);
      timer = setTimeout(setUrl, 500);
    });

    input.addEventListener("keydown", function(e) {
      if (e.key === "Enter") {
        e.preventDefault();
        clearTimeout(timer);
        setUrl();
      }
    });

    window.addEventListener("load", function() {
      setTimeout(ready, 600);
    });

    document.body.addEventListener("click", function(event) {
      if (event.target.tagName !== "BUTTON" && event.target.tagName !== "A") {
        input.focus();
      }
    });
  </script>
</body>
</html>
